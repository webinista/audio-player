<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <title>AudioPlayer</title>
  <style>
  :root {
    --track: #d6e8eb;
    --thumb: #1874d0;
  }
  
  @media (dark-mode) {
    :root {
      --track: #d6e8eb;
      --thumb: #1874d0;
    }
  }
  
  .audio-player {}
  
  .audio-player-track {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  
  .audio-player-track {
    display: grid;
    grid-template-areas: "currentTime track duration";
    grid-template-columns: min-content 1fr min-content;
   
    [type=range], progress {
      grid-area: track;
      width: 100%;
    }
    
    [type=range] {
      -webkit-appearance: none;
      appearance: none;

      background: transparent;
      
      &::-moz-range-thumb {
        background: var(--thumb);
        border-color: transparent;
        inline-size: 1.5rem;
      }
      
      &::-webkit-slider-thumb {
        background: var(--thumb);
        border-color: transparent;
        inline-size: 1.5rem;
      }

      &::slider-thumb {
        background: var(--thumb);
        border-color: transparent;
        inline-size: 1.5rem;
      }
    }
    
    progress {
      -webkit-appearance: none;
      appearance: none;
      border-radius: 100rem;
      overflow: hidden;

      &::-moz-progress-bar {
        background: var(--track);
        border-color: transparent;
      }

      &::-webkit-progress-bar {
        background: var(--track);
      }

      &::-webkit-progress-inner-element {
        background: black;
      }
    }
    
    output {
      grid-area: currentTime;
    }

    label {
      grid-area: duration;
    } 
  }

  .audio-player-controls {
    gap: .5rem;
    justify-content: end;
  }


  </style>
</head>
<body>
<!-- https://developer.mozilla.org/en-US/docs/Web/HTML/Element/progress -->
<div class="audio-player">
  <audio preload="metadata" src="cash-in-lieu-of-fractional-shares.b015e028-9d6e-4107-9467-56532f694386.mp3" nodownload></audio>
  <h2>Listen to this post</h2>
  <form>
    <p class="audio-player-track">
      <output name="current-time" for="audio-progress">0:00</output>
      <progress value="0" id="audio-progress" name="audio-progress"></progress>
      <input type="range" min="0" max="1" value="0" step="0.01" name="audio-duration" id="audio-duration">
      <label for="audio-duration">0:00</label>
    </p>
    <p class="audio-player-controls">
      <button type="button" aria-label="Go back 10 seconds" data-action="back" disabled>
        Go back 10 seconds
      </button>
      <button type="button" data-action="play" aria-label="Play audio">Play</button>
      <button type="button" data-action="stop" aria-label="Pause audio" hidden>Pause</button>
      <button type="button" data-action="forward" aria-label="Skip ahead 10 seconds">
        Skip ahead 10 seconds
      </button>
    </p>
  </form>
</div>


<script type="module">
const audios = document.querySelector('.audio-player');

const formatTime = (seconds) => {
  const SECONDS_IN_MINUTE = 60;
  const minutes = (seconds / SECONDS_IN_MINUTE);
  
  const minute_part = Math.floor(minutes);
  const sec = SECONDS_IN_MINUTE * (minutes - minute_part);

  return `${minute_part}:${Math.round(sec).toString().padStart(2, 0)}`;
}

const actions = {
  play: (target, aud) => {
    aud.play();
    target.toggleAttribute('hidden');
    target.parentNode.querySelector('[data-action=stop]').toggleAttribute('hidden');
    
    if(aud.currentTime >= 10) {
      aud.parentNode.querySelector('[data-action=back]').removeAttribute('disabled')
    }
    if(aud.currentTime < 10) {
      aud.parentNode.querySelector('[data-action=back]').setAttribute('disabled', true)
    }
  },
  stop: (target, aud) => {
    aud.pause();
    target.toggleAttribute('hidden');
    target.parentNode.querySelector('[data-action=play]').toggleAttribute('hidden');
  },
  back: (target, aud) => {
    aud.currentTime = aud.currentTime - 10;
    aud.parentNode.querySelector('[data-action=forward]').removeAttribute('disabled');
  },
  forward: (target, aud) => (aud.currentTime = aud.currentTime + 10),
  currentTime: (value, duration) => {
    return Math.round(+value * duration);
  },
  reflectTime: (currentTime, duration) => {
    return currentTime / duration;
  }
};

audios.querySelector('audio').addEventListener('durationchange', (evt) => {
  const dur = evt.target.parentNode.querySelector('label[for=audio-duration]');
  const seconds = document.createTextNode(formatTime(evt.target.duration));
  dur.replaceChild(seconds, dur.firstChild);
});

audios.querySelector('[type=range]').addEventListener('input', (evt) => {
  const player = audios.querySelector('audio');
  const seekTo = actions.currentTime(evt.target.value, player.duration);

  if('fastSeek' in player) {
    player.fastSeek(seekTo);
  } else {
    player.currentTime = seekTo;
  }
});

audios.addEventListener('click', (evt) => {
  if (evt.target.nodeName !== 'BUTTON') return false;
  const aud = audios.querySelector('audio');
  actions[evt.target.dataset.action](evt.target, aud);
});

audios.querySelector('audio').addEventListener('timeupdate', (evt) => {
  const target = evt.target;
  const currentTime = audios.querySelector('output');
  const time = actions.reflectTime(evt.target.currentTime, evt.target.duration);

  if (target.currentTime > 10) {
    audios.querySelector('[data-action=back]').removeAttribute('disabled');
  } else {
    audios.querySelector('[data-action=back]').setAttribute('disabled', true);
  }
  
  if (target.currentTime >= target.duration) {
    audios.querySelector('[data-action=forward]').setAttribute('disabled', true);
  } else {
    audios.querySelector('[data-action=forward]').removeAttribute('disabled');
  }
  
  const range = audios.querySelector('[type=range]');
  const progress = audios.querySelector('progress');

  range.value = time;
  progress.value = range.value;
  
  currentTime.value = formatTime(evt.target.currentTime);
});

audios.querySelector('audio').addEventListener('ended', (evt) => {
  const target = evt.target;
  audios.querySelector('[data-action=forward]').setAttribute('disabled', true);
  audios.querySelector('[data-action=play]').removeAttribute('hidden');
  audios.querySelector('[data-action=stop]').setAttribute('hidden', true);
});

document.addEventListener('DOMContentLoaded', () => {
  audios.querySelector('input').value = 0;
  audios.querySelector('progress').value = 0;
})

</script>


</body>
</html>
